name: Publicar site
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"   # pega sozinho a versão nova do instalador
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/montar.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # O GitHub as vezes demora a achar o pacote: espera e tenta mais uma vez.
      - if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
